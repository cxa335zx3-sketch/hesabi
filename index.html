<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>حِسابي — نظام إدارة الأعمال والمحاسبة</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#111827}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 8px 25px #00000008}.brand{font-size:28px;font-weight:800}.muted{color:#6b7280}.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#111827;color:#fff}.ghost{background:#eef2f7}.danger{background:#fee2e2;color:#991b1b}.input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stats .card b{font-size:25px;display:block;margin-top:8px}.layout{display:grid;grid-template-columns:230px 1fr;gap:18px}.side{position:sticky;top:15px;height:max-content}.nav button{width:100%;text-align:right;margin:5px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:right}.auth{max-width:460px;margin:7vh auto}.logo{font-size:46px;font-weight:900;margin-bottom:6px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div id="auth" class="wrap auth"><div class="card"><div class="logo">حِسابي</div><div class="muted">نظام إدارة الأعمال والمحاسبة</div><hr><div id="loginBox"><h2>تسجيل الدخول</h2><input id="lemail" class="input" placeholder="البريد الإلكتروني"><input id="lpass" class="input" type="password" placeholder="كلمة المرور"><button class="btn primary" onclick="login()">دخول</button><button class="btn ghost" onclick="showReg()">إنشاء حساب منشأة</button></div><div id="regBox" class="hidden"><h2>إنشاء حساب جديد</h2><input id="bname" class="input" placeholder="اسم المنشأة"><input id="uname" class="input" placeholder="اسم المستخدم"><input id="remail" class="input" placeholder="البريد الإلكتروني"><input id="rpass" class="input" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)"><button class="btn primary" onclick="register()">إنشاء الحساب</button><button class="btn ghost" onclick="showLogin()">رجوع للدخول</button></div><p id="msg" class="muted"></p></div></div><div id="app" class="hidden"><div class="wrap"><div class="top"><div><div class="brand">حِسابي</div><div class="muted" id="biz"></div></div><button class="btn ghost" onclick="logout()">تسجيل الخروج</button></div><div class="layout"><aside class="card side nav"><button class="btn primary" onclick="page('dash')">الرئيسية</button><button class="btn ghost" onclick="page('sales')">المبيعات والفواتير</button><button class="btn ghost" onclick="page('purchases')">المشتريات</button><button class="btn ghost" onclick="page('expenses')">المصروفات</button><button class="btn ghost" onclick="page('products')">المخزون والمنتجات</button><button class="btn ghost" onclick="page('reports')">التقارير</button></aside><main id="main"></main></div></div></div><script>
let token=localStorage.getItem('hesabi_token'),me=null;const $=id=>document.getElementById(id);function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d=await r.json();if(!r.ok)throw Error(d.error||'حدث خطأ');return d}function showReg(){$('loginBox').classList.add('hidden');$('regBox').classList.remove('hidden')}function showLogin(){$('regBox').classList.add('hidden');$('loginBox').classList.remove('hidden')}async function login(){try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('lemail').value,password:$('lpass').value})});token=d.token;localStorage.setItem('hesabi_token',token);boot()}catch(e){$('msg').textContent=e.message}}async function register(){try{let d=await api('/api/register',{method:'POST',body:JSON.stringify({businessName:$('bname').value,name:$('uname').value,email:$('remail').value,password:$('rpass').value})});token=d.token;localStorage.setItem('hesabi_token',token);boot()}catch(e){$('msg').textContent=e.message}}function logout(){localStorage.removeItem('hesabi_token');location.reload()}async function boot(){try{me=await api('/api/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('biz').textContent=me.business.name;page('dash')}catch(e){logout()}}async function page(p){if(p==='dash'){let d=await api('/api/dashboard');$('main').innerHTML=`<div class="grid stats"><div class="card">المبيعات<b>${fmt(d.sales)}</b></div><div class="card">المشتريات<b>${fmt(d.purchases)}</b></div><div class="card">المصروفات<b>${fmt(d.expenses)}</b></div><div class="card">صافي النتيجة<b>${fmt(d.net)}</b></div></div><div class="card" style="margin-top:15px"><h2>ملخص سريع</h2><p>عدد المنتجات: ${d.products} — منتجات تحتاج إعادة طلب: ${d.lowStock}</p></div>`}else if(p==='sales')await listTx('sale','المبيعات والفواتير');else if(p==='purchases')await listTx('purchase','المشتريات');else if(p==='expenses')await listTx('expense','المصروفات');else if(p==='products')await products();else if(p==='reports'){let d=await api('/api/dashboard');$('main').innerHTML=`<div class="card"><h2>التقرير المالي المختصر</h2><table class="table"><tr><th>البند</th><th>القيمة</th></tr><tr><td>إجمالي المبيعات</td><td>${fmt(d.sales)}</td></tr><tr><td>إجمالي المشتريات</td><td>${fmt(d.purchases)}</td></tr><tr><td>إجمالي المصروفات</td><td>${fmt(d.expenses)}</td></tr><tr><td><b>صافي النتيجة</b></td><td><b>${fmt(d.net)}</b></td></tr></table></div>`}}function fmt(n){return Number(n||0).toLocaleString('ar-SA',{minimumFractionDigits:2})+' ر.س'}async function listTx(type,title){let rows=await api('/api/transactions');rows=rows.filter(x=>x.type===type);$('main').innerHTML=`<div class="card"><div class="top"><h2>${title}</h2><button class="btn primary" onclick="addTx('${type}')">+ إضافة</button></div><table class="table"><thead><tr><th>الرقم</th><th>التاريخ</th><th>الطرف</th><th>المبلغ</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.number||'-'}</td><td>${x.date||'-'}</td><td>${x.party||'-'}</td><td>${fmt(x.amount)}</td><td><button class="btn danger" onclick="delTx(${x.id},'${type}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}async function addTx(type){let title=type==='sale'?'إضافة فاتورة بيع':type==='purchase'?'إضافة مشتريات':'إضافة مصروف';$('main').innerHTML=`<div class="card"><h2>${title}</h2><div class="formgrid"><div><label>الرقم</label><input id="tno" class="input" value="${Date.now().toString().slice(-6)}"></div><div><label>التاريخ</label><input id="td" class="input" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>العميل/المورد/البيان</label><input id="tp" class="input"></div><div><label>طريقة الدفع</label><select id="pay" class="input"><option>نقدي</option><option>تحويل بنكي</option><option>شبكة</option><option>آجل</option></select></div><div><label>المبلغ</label><input id="ta" class="input" type="number" step="0.01"></div><div><label>ملاحظة</label><input id="tn" class="input"></div></div><button class="btn primary" onclick="saveTx('${type}')">حفظ</button> <button class="btn ghost" onclick="page('${type==='sale'?'sales':type==='purchase'?'purchases':'expenses'}')">رجوع</button></div>`}async function saveTx(type){try{await api('/api/transactions',{method:'POST',body:JSON.stringify({type,number:$('tno').value,date:$('td').value,party:$('tp').value,payment:$('pay').value,amount:$('ta').value,note:$('tn').value})});page(type==='sale'?'sales':type==='purchase'?'purchases':'expenses')}catch(e){alert(e.message)}}async function delTx(id,type){if(!confirm('حذف العملية؟'))return;await api('/api/transactions/'+id,{method:'DELETE'});page(type==='sale'?'sales':type==='purchase'?'purchases':'expenses')}async function products(){let rows=await api('/api/products');$('main').innerHTML=`<div class="card"><div class="top"><h2>المخزون والمنتجات</h2><button class="btn primary" onclick="addProduct()">+ منتج</button></div><table class="table"><thead><tr><th>المنتج</th><th>SKU</th><th>الكمية</th><th>السعر</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.name}</td><td>${x.sku||'-'}</td><td>${x.qty}</td><td>${fmt(x.price)}</td><td><button class="btn danger" onclick="delProduct(${x.id})">حذف</button></td></tr>`).join('')}</tbody></table></div>`}function addProduct(){$('main').innerHTML=`<div class="card"><h2>إضافة منتج</h2><input id="pn" class="input" placeholder="اسم المنتج"><input id="ps" class="input" placeholder="SKU / كود المنتج"><input id="pq" class="input" type="number" placeholder="الكمية"><input id="pp" class="input" type="number" step="0.01" placeholder="السعر"><input id="pm" class="input" type="number" placeholder="حد إعادة الطلب"><button class="btn primary" onclick="saveProduct()">حفظ</button> <button class="btn ghost" onclick="products()">رجوع</button></div>`}async function saveProduct(){try{await api('/api/products',{method:'POST',body:JSON.stringify({name:$('pn').value,sku:$('ps').value,qty:$('pq').value,price:$('pp').value,min_qty:$('pm').value})});products()}catch(e){alert(e.message)}}async function delProduct(id){if(!confirm('حذف المنتج؟'))return;await api('/api/products/'+id,{method:'DELETE'});products()}if(token)boot();
</script></body></html>
